name: Build macOS (iMac & MacBook)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Universal DMG & ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Package macOS Universal Apps (.dmg & .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip --universal -c.mac.identity=null

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-macos-universal
          path: release/ORBIT-Mac-*
          if-no-files-found: error
